name: Deploy to GitHub Pages

# Manual only: run from the Actions tab ("Run workflow"). Beta site: the job
# only runs for ui-alpha-01, so picking any other branch does nothing.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/ui-alpha-01'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - run: yarn install --frozen-lockfile

      # CI=false so lint warnings don't fail the build (same as a local build)
      - run: yarn build
        env:
          CI: false

      # Publishes build/ to the gh-pages branch, same as `npm run deploy`.
      # gh-pages pushes from its own clone, which doesn't inherit the checkout
      # step's credentials, so the token goes in the repo URL.
      - run: |
          npx gh-pages -d build \
            -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
